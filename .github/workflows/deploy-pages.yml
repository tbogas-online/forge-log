name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write version metadata
        run: |
          ISO=$(git log -1 --format=%cI)
          HASH=$(git rev-parse --short HEAD)
          printf '{"updatedAt":"%s","commit":"%s"}\n' "$ISO" "$HASH" > data/version.json
          for asset in app.js styles.css prs.js coach.js calendar.js data/workouts.js; do
            sed -i "s|${asset}\"|${asset}?v=${HASH}\"|g" index.html
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
